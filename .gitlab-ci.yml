stages:
  - build
  - release

variables:
  TEXINPUTS: ".:"

build_cv_pdf:
  stage: build
  image: texlive/texlive:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
    - DATE_EN="$(LC_TIME=C date '+%B %d, %Y')"
    - PDF_NAME="CV Rocky Prabowo (${DATE_EN}).pdf"
    - LOG_NAME="main_${CI_COMMIT_TAG}.log"
    - mkdir -p artifact
    - cp main.pdf "artifact/${PDF_NAME}"
    - cp main.log "artifact/${LOG_NAME}"
    - cd artifact && zip -q "../cv-pdf-${CI_COMMIT_TAG}.zip" "${PDF_NAME}" "${LOG_NAME}"
  artifacts:
    name: "cv-pdf-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - cv-pdf-*.zip

release_cv_pdf:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.94.0
  needs:
    - job: build_cv_pdf
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "Automated CV PDF release for tag $CI_COMMIT_TAG"
    assets:
      links:
        - name: "cv-pdf-${CI_COMMIT_TAG}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/cv-pdf-${CI_COMMIT_TAG}.zip"
