name: Build CV PDF

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Package build artifact
        run: |
          DATE_EN="$(LC_TIME=C date '+%B %d, %Y')"
          TAG="${GITHUB_REF_NAME}"
          PDF_NAME="CV Rocky Prabowo (${DATE_EN}).pdf"
          LOG_NAME="main_${TAG}.log"
          mkdir -p artifact
          cp main.pdf "artifact/${PDF_NAME}"
          cp main.log "artifact/${LOG_NAME}"
          (
            cd artifact
            zip -q "../cv-pdf-${TAG}.zip" "${PDF_NAME}" "${LOG_NAME}"
          )

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: |
            cv-pdf-*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf
          path: release-assets

      - name: Extract release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          unzip -q "release-assets/cv-pdf-${TAG}.zip" -d release-assets

      - name: Verify release assets
        run: ls -lah release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.pdf
            release-assets/main_*.log
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
