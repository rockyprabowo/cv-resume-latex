name: Build CV PDF

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: |
            main.pdf
            main.log
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf

      - name: Rename release assets
        id: rename_assets
        run: |
          DATE_EN="$(LC_TIME=C date '+%B %d, %Y')"
          TAG="${GITHUB_REF_NAME}"
          PDF_NAME="CV Rocky Prabowo (${DATE_EN}).pdf"
          LOG_NAME="main_${TAG}.log"
          mv main.pdf "${PDF_NAME}"
          mv main.log "${LOG_NAME}"
          echo "pdf_name=${PDF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "log_name=${LOG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.rename_assets.outputs.pdf_name }}
            ${{ steps.rename_assets.outputs.log_name }}
          generate_release_notes: true
