name: Build CV PDF

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: |
            main.pdf
            main.log
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v5
        with:
          name: cv-pdf
          path: release-assets

      - name: Rename release assets
        run: |
          DATE_EN="$(LC_TIME=C date '+%B %d, %Y')"
          TAG="${GITHUB_REF_NAME}"
          PDF_NAME="CV Rocky Prabowo (${DATE_EN}).pdf"
          LOG_NAME="main_${TAG}.log"
          test -f release-assets/main.pdf
          test -f release-assets/main.log
          mv release-assets/main.pdf "release-assets/${PDF_NAME}"
          mv release-assets/main.log "release-assets/${LOG_NAME}"

      - name: Verify release assets
        run: ls -lah release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.pdf
            release-assets/main_*.log
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
